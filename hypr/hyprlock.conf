source = colors.conf
$font = Google Sans Flex
# BACKGROUND
background {
    monitor =
    path = screenshot
    blur_passes = 3
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# Profie-Photo
image {
    monitor =
    path = 
    border_size = 2
    border_color = $outline
    size = 130
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, 40
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = $on_surface
    font_size = 25
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = $on_surface
    font_size = 120
    font_family = $font
    position = 0, 0
    halign = center
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 200, 60
    color = $surface_container
    rounding = -1
    border_size = 2
    border_color = $outline_variant
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)

    position = -260, -480
    halign = center
    valign = center
}

shape {
    monitor =
    size = 250, 60
    color = $surface_container
    rounding = -1
    border_size = 2
    border_color = $outline_variant
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)

    position = 285, -480
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =    $USER
    color = $on_surface
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 18
    font_family = $font
    position = -260, -480
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "󰔚  <span>$(uptime -p | sed 's/up //')</span>"
    color = $on_surface
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 17
    font_family = $font
    position = 285, -480
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $outline_variant
    inner_color = $surface_container
    font_color = $on_surface
    fade_on_empty = false
    font_family = $font
    font_size = 18
    placeholder_text = Input password...
    hide_input = false
    position = 0, -480
    halign = center
    valign = center
}

